<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok yetkilendirme - SSautomation</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem; line-height: 1.6; }
  h1 { font-size: 1.5rem; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 1rem; word-break: break-all; background: rgba(127,127,127,.16);
          padding: 1rem; border-radius: 8px; margin: 1rem 0; }
  button { font: inherit; padding: .6rem 1.1rem; border-radius: 8px;
           border: 1px solid rgba(127,127,127,.4); background: transparent;
           cursor: pointer; }
  .err { color: #c0392b; }
  .ok { color: #1e8e3e; }
  ol { padding-left: 1.2rem; }
</style>
</head>
<body>

<h1>TikTok yetkilendirme</h1>
<div id="out">Yukleniyor...</div>

<script>
  var p = new URLSearchParams(location.search);
  var code = p.get("code");
  var err = p.get("error_description") || p.get("error");
  var out = document.getElementById("out");

  if (code) {
    out.innerHTML =
      '<p class="ok">Yetkilendirme basarili. Asagidaki kodu kopyala:</p>' +
      '<div class="code" id="c"></div>' +
      '<button id="b">Kodu kopyala</button>' +
      '<p>Sonra terminalde su komutu calistir:</p>' +
      '<div class="code">.venv/bin/python tools/tiktok_auth.py --code &lt;KOD&gt;</div>' +
      '<p>Bu kod tek kullanimliktir ve birkac dakika icinde gecersiz olur.</p>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("b").textContent = "Kopyalandi";
      });
    };
  } else if (err) {
    out.innerHTML = '<p class="err">Yetkilendirme basarisiz: ' +
      err.replace(/[<>&]/g, "") + '</p><p>Betigi tekrar calistir.</p>';
  } else {
    out.innerHTML =
      '<p>Bu sayfa TikTok yetkilendirmesinin donus adresidir.</p>' +
      '<p>Dogrudan acildiginda gosterecek bir sey yok. Akisi baslatmak icin:</p>' +
      '<div class="code">.venv/bin/python tools/tiktok_auth.py</div>';
  }
</script>

</body>
</html>
